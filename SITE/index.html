<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!--configurações da pagina, não aparecem na tela-->
    <meta charset="UTF-8">
    <title> Yu-Gi-Oh Database </title>
    <link rel="stylesheet" href="style.css"> <!-- o CSS entra aqui-->
</head>

<body>
    <!-- inserir o titulo principal do site e um menu de vanegação basico -->
    <header>
        <h1> Yu-Gi-Oh Database</h1>
        <nav>...</nav>
    </header>

    <!-- estruturar o conteudo principal (main)-->
    <main>
        <!-- áreas de busca e grid virão aqui -->

        <!--SEÇÃO DE BUSCAS-->
        <section class="search-section">
            <form id="search-form">
                <input type="text" id="card-search-input" placeholder="Digite o nome da carta">
                <button type="submit"> Search </button>
            </form>
        </section>
        <!-- GRADE DE CARTAS -->
        <section class="card-search-section">
            <div id="card-grid" class="card-grid">
                <!-- os cards gerados via JS aparecerão aqui -->
            </div>
        </section>
    </main>

    <!-- add o rodapé -->
    <!-- inserir informações de copyright e links uteis ao final do documento -->
    <footer>
        <p>&copy; 2026 Yu-Gi-Oh Consulta. Todos os direitos reservados. </p>
    </footer>
    <!-- Modal de Detalhes da Carta -->
    <div id="card-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <div id="modal-details">
                <!-- Conteúdo preenchido dinamicamente pelo JavaScript -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
